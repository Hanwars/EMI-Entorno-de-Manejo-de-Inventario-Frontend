<div class="container py-5 mt-4">
  @if (currentUser()) {
    <div>
      <h2 class="align-items-center">{{ 'home.welcome' | translate: { name: currentUser()?.name } }}</h2>
    </div>
  }
  <div class="row align-items-center">
    <div class="col-md-6">
      <h1 class="display-3 fw-bold">{{ 'app.title' | translate }}</h1>
      <h2 class="mb-4">{{ 'app.fullTitle' | translate }}</h2>
      <p class="lead">{{ 'home.description' | translate }}</p>
      <p class="text-secondary">{{ 'home.details' | translate }}</p>
      <div class="mt-5">
        @if (!currentUser()) {
          <button class="btn btn-danger btn-lg me-2" [routerLink]="['/login']">{{ 'home.start' | translate }}</button>
        }
        <button class="btn btn-outline-danger btn-lg">{{ 'home.learnMore' | translate }}</button>
      </div>
    </div>
    <div class="col-md-6">
      <div>
        <div class="card-body text-center py-5">
          <img src="../../../LogoEMI.png" [alt]="'home.logoAlt' | translate" class="img-fluid" />
        </div>
      </div>
    </div>
  </div>
</div>
